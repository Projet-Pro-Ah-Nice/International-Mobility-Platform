server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls -> backend container (the trailing slash strips the /api prefix)
    location /api/ {
        proxy_pass http://backend:3000/;
    }

    # Everything else -> the React app (SPA fallback for client-side routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
